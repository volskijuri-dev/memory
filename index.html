<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memory</title>
</head>

<body>

    <main class="memory">

        <header class="memory-header">
            <h1>Memory</h1>
            <p>Finde alle passenden Kartenpaare!</p>
        </header>

        <section class="game-info">
            <div class="moves">
                <span>Züge:</span>
                <strong id="moves">0</strong>
            </div>

            <div class="pairs">
                <span>Paare:</span>
                <strong id="pairs">0</strong>
            </div>

            <button id="restart-button" type="button">
                Neu starten
            </button>
        </section>

        <section
            class="game-board"
            id="game-board"
            aria-label="Memory Spielfeld"
        >
            <!-- Karten werden mit TypeScript erzeugt -->
        </section>

    </main>

    <script type="module" src="src/scripts/script.ts"></script>

</body>

</html>
