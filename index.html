<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
</head>

<body>

    <main class="memory">

        <!-- SETTINGS -->
        <section class="settings" id="settings">

            <h1 class="settings__title">Settings</h1>

            <div class="settings__content">

                <div class="settings__options">

                    <!-- GAME THEME -->
                    <fieldset class="settings__group">
                        <legend>🎨 Game themes</legend>

                        <label>
                            <input type="radio" name="theme" value="coding" checked>
                            Code vibes theme
                        </label>

                        <label>
                            <input type="radio" name="theme" value="gaming">
                            Gaming theme
                        </label>

                        <label>
                            <input type="radio" name="theme" value="academy">
                            DA Projects theme
                        </label>

                        <label>
                            <input type="radio" name="theme" value="food">
                            Foods theme
                        </label>
                    </fieldset>


                    <!-- PLAYER -->
                    <fieldset class="settings__group">
                        <legend>♙ Choose player</legend>

                        <label>
                            <input type="radio" name="player" value="blue" checked>
                            Blue
                        </label>

                        <label>
                            <input type="radio" name="player" value="orange">
                            Orange
                        </label>
                    </fieldset>


                    <!-- BOARD SIZE -->
                    <fieldset class="settings__group">
                        <legend>▧ Board size</legend>

                        <label>
                            <input type="radio" name="board-size" value="16" checked>
                            16 cards
                        </label>

                        <label>
                            <input type="radio" name="board-size" value="24">
                            24 cards
                        </label>

                        <label>
                            <input type="radio" name="board-size" value="36">
                            36 cards
                        </label>
                    </fieldset>

                </div>


                <!-- PREVIEW -->
                <div class="settings__preview">

                    <div class="preview-card">
                        <span class="preview-card__back">
                            &lt;/&gt;
                        </span>

                        <span class="preview-card__front">
                            Git
                        </span>
                    </div>

                    <div class="settings__summary">
                        <span id="selected-theme">
                            Code vibes
                        </span>

                        <span id="selected-player">
                            Blue
                        </span>

                        <span id="selected-size">
                            16 cards
                        </span>

                        <button id="start-button" type="button">
                            ▶ Start
                        </button>
                    </div>

                </div>

            </div>

        </section>


        <!-- GAME -->
        <section class="game hidden" id="game">

            <header class="game__header">

                <div class="game__scores">
                    <span>
                        🔵 Blue
                        <strong id="blue-score">0</strong>
                    </span>

                    <span>
                        🟠 Orange
                        <strong id="orange-score">0</strong>
                    </span>
                </div>

                <div class="game__player">
                    Current player:
                    <strong id="current-player">
                        Blue
                    </strong>
                </div>

                <button id="exit-button" type="button">
                    ⇱ Exit game
                </button>

            </header>

            <section class="game-board" id="game-board" aria-label="Memory Spielfeld">
            </section>

        </section>

        <!-- EXIT MODAL -->
        <div class="modal hidden" id="exit-modal" role="dialog" aria-modal="true" aria-labelledby="exit-modal-title">
            <div class="modal__content">

                <h2 id="exit-modal-title">
                    Are you sure you want to quit the game?
                </h2>

                <div class="modal__actions">

                    <button class="modal__button modal__button--back" id="back-to-game-button" type="button">
                        Back to game
                    </button>

                    <button class="modal__button modal__button--exit" id="confirm-exit-button" type="button">
                        Exit game
                    </button>

                </div>

            </div>
        </div>

        <!-- GAME OVER SCREEN -->
        <section class="result-screen hidden" id="game-over-screen">

            <h2 class="result-screen__game-over">
                GAME OVER
            </h2>

            <p class="result-screen__label">
                Final score
            </p>

            <div class="result-screen__score">
                <span class="result-screen__score-blue">
                    🔵
                    <strong id="final-blue-score">0</strong>
                </span>

                <span class="result-screen__score-orange">
                    🟠
                    <strong id="final-orange-score">0</strong>
                </span>
            </div>

        </section>


        <!-- WINNER / DRAW SCREEN -->
        <section class="result-screen hidden" id="winner-screen">

            <p class="result-screen__label" id="winner-label">
                The winner is
            </p>

            <h2 class="result-screen__winner" id="winner-name">
                Blue Player
            </h2>

            <div class="result-screen__icon" id="result-icon">
                🏆
            </div>

            <button class="result-screen__home" id="home-button" type="button">
                Home
            </button>

        </section>

    </main>

    <script type="module" src="/src/scripts/script.ts"></script>

</body>

</html>
